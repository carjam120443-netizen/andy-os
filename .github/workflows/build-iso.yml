name: Build Andy OS x86_64 ISO

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-iso.yml"
      - "configs/**"
      - "manifests/**"
      - "scripts/**"
      - "build/**"
      - "assets/**"

permissions:
  contents: read

jobs:
  build-iso:
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    steps:
      - name: Checkout Andy OS
        uses: actions/checkout@v4

      - name: Install ISO customization and boot-test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y             qemu-system-x86             xorriso             squashfs-tools             e2fsprogs             util-linux             librsvg2-bin             imagemagick             unzip             zip

      - name: Download Android-x86 9.0-r2 x86_64 ISO
        run: |
          set -euo pipefail
          mkdir -p dist
          url="https://sourceforge.net/projects/android-x86/files/Release%209.0/android-x86_64-9.0-r2.iso/download"
          for attempt in 1 2 3 4 5; do
            echo "Download attempt $attempt/5"
            if curl -fL --retry 3 --retry-delay 5 -C - --connect-timeout 30 --max-time 1800               "$url" -o dist/andy-os-x86_64-9.0-r2.iso; then
              break
            fi
            if [ "$attempt" -eq 5 ]; then
              echo "ISO download failed after 5 attempts"
              exit 1
            fi
            sleep 10
          done

      - name: Customize default wallpaper
        run: |
          set -euo pipefail
          chmod +x scripts/customize-iso.sh
          mv dist/andy-os-x86_64-9.0-r2.iso dist/android-x86-base.iso
          scripts/customize-iso.sh             dist/android-x86-base.iso             dist/andy-os-x86_64-9.0-r2.iso             assets/andy-os-robot-wallpaper.svg
          rm -f dist/android-x86-base.iso

      - name: Verify ISO and boot equipment
        run: |
          set -euo pipefail
          test -s dist/andy-os-x86_64-9.0-r2.iso
          echo "Actual SHA-256:"
          sha256sum dist/andy-os-x86_64-9.0-r2.iso
          echo "El Torito boot report:"
          xorriso -indev dist/andy-os-x86_64-9.0-r2.iso -report_el_torito plain -report_system_area plain
          xorriso -indev dist/andy-os-x86_64-9.0-r2.iso -find /android -maxdepth 1 -type f -print
          echo "Bootloader structure check passed."

      - name: QEMU boot smoke test
        run: |
          set -euo pipefail
          set +e
          timeout --signal=TERM 30s             qemu-system-x86_64               -machine accel=tcg               -m 2048               -cdrom dist/andy-os-x86_64-9.0-r2.iso               -boot d               -display none               -monitor none               -serial none               -no-reboot               -no-shutdown
          rc=$?
          set -e
          if [ "$rc" -eq 124 ]; then
            echo "QEMU stayed alive for the full smoke-test window; ISO did not immediately abort."
          elif [ "$rc" -eq 0 ]; then
            echo "QEMU exited cleanly during the smoke test."
          else
            echo "QEMU exited with status $rc."
            exit "$rc"
          fi

      - name: Write build metadata
        run: |
          cat > dist/BUILD.txt <<'EOF'
          Andy OS x86_64 customized ISO
          Base: Android-x86 9.0-r2
          Architecture: x86_64
          Default wallpaper: Andy OS robot wallpaper
          Boot validation: El Torito/system-area inspection + QEMU smoke test
          Source: https://www.android-x86.org/
          This artifact preserves the upstream boot equipment while replacing the framework default wallpaper.
          EOF

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: andy-os-x86_64-9.0-r2
          path: dist/
          if-no-files-found: error
          retention-days: 14
